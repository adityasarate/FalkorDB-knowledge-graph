services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "127.0.0.1:6379:6379"  # FalkorDB Redis protocol
      - "127.0.0.1:3000:3000"  # FalkorDB Visual Graph Browser
    environment:
      - REDIS_ARGS=--appendonly yes
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  falkordb_data:
    